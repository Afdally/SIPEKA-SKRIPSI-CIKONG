<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Pelaporan Kekerasan Perempuan & Anak Kota Kendari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Tailwind (CDN) dipakai khusus halaman Login (LoginPage.jsx). Diberi
         prefix "tw-" dan preflight dimatikan supaya tidak menabrak Bootstrap
         + CSS custom yang dipakai halaman lain (landing, dashboard).
         Config HARUS di-set setelah script CDN dimuat, bukan sebelum —
         `tailwind` baru ada di window setelah script ini jalan. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { prefix: 'tw-', corePlugins: { preflight: false } };
    </script>
    <!-- Edge/Chromium otomatis nambah tombol "reveal password" bawaan browser
         di atas input password — numpuk sama tombol mata custom di LoginPage.
         Dimatikan di sini karena pseudo-element ini tidak bisa disentuh lewat
         className Tailwind. -->
    <style>
      input[type="password"]::-ms-reveal,
      input[type="password"]::-ms-clear {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
