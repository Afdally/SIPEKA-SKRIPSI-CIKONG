worker_processes auto;
worker_rlimit_nofile 8192;

events {
    # Koneksi klien dan koneksi ke backend sama-sama memakai slot worker.
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Batas waktu identik untuk kedua arsitektur (nilai default Nginx).
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # Mendaftarkan server internal Docker
    # `resolve` mencegah alamat IP lama tertahan setelah container di-recreate.
    upstream report {
        zone report 64k;
        server report-service:8000 resolve;
        keepalive 128;
    }
    upstream case {
        zone case 64k;
        server case-service:8000 resolve;
        keepalive 128;
    }

    upstream monolith {
        zone monolith 64k;
        server monolith-service:8000 resolve;
        keepalive 128;
    }

    server {
        listen 80;

        # 1. Routing ke Auth (digabung ke Case Service)
        location /api/auth {
            proxy_pass http://case;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Endpoint reminder hanya untuk komunikasi langsung antar-service.
        # Jangan pernah teruskan endpoint ini dari gateway publik.
        location ^~ /api/laporan/internal/ {
            return 404;
        }

        # 2. Routing ke Report Service
        location /api/laporan {
            proxy_pass http://report;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # 3. Routing ke Case Service
        location /api/penanganan {
            proxy_pass http://case;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Routing Master Data: Kekerasan (Report Service)
        location /api/master/kekerasan {
            proxy_pass http://report;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Routing Master Data: Metode Penanganan (Case Service)
        location /api/master/metode {
            proxy_pass http://case;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Routing statis foto laporan (Report Service)
        location /storage/ {
            proxy_pass http://report;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Port host 8090 diteruskan ke listener ini oleh Docker Compose.
    server {
        listen 8090;

        location ^~ /api/laporan/internal/ {
            return 404;
        }

        location / {
            proxy_pass http://monolith;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

}
