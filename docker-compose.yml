services:
  # ============================================
  # DATABASE (1 MongoDB)
  # ============================================

  mongodb:
    image: mongo:latest
    container_name: ircm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - ircm-network

  # ============================================
  # MESSAGE BROKER (RabbitMQ)
  # ============================================

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ircm-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ircm-network

  # ============================================
  # BACKEND CONTAINERS (2 Express Services)
  # ============================================

  report-service:
    build:
      context: ./backend/reporting-service
      dockerfile: Dockerfile
    container_name: ircm-report-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/report_db
      JWT_SECRET: ircm_secret_key
      RABBITMQ_URL: amqp://rabbitmq:5672
      PORT: 8000
      # Ollama diperlakukan sebagai infrastruktur eksternal, bukan microservice.
      # host.docker.internal = Ollama jalan di mesin host (pakai GPU host langsung).
      # Ganti ke IP LAN kalau Ollama ada di PC lain, mis. http://192.168.1.20:11434
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
      # Tahan model di memori supaya laporan berikutnya tidak kena biaya
      # muat ulang model dari disk (5-20 detik di CPU) — tapi lepas lagi setelah
      # sepi. Dengan 24h, 1,9 GB tertahan seharian demi belasan laporan sebulan;
      # di mesin 8 GB yang dipakai bersama Docker itu terlalu mahal.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    extra_hosts:
      # Diperlukan di Linux/WSL supaya host.docker.internal bisa diresolusi
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/reporting-service:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - ircm-network

  case-service:
    build:
      context: ./backend/case-service
      dockerfile: Dockerfile
    container_name: ircm-case-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/case_db
      JWT_SECRET: ircm_secret_key
      JWT_TTL: 3600
      RABBITMQ_URL: amqp://rabbitmq:5672
      PORT: 8000
    volumes:
      - ./backend/case-service:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - ircm-network

  # ============================================
  # API GATEWAY (NGINX)
  # ============================================

  api-gateway:
    image: nginx:alpine
    container_name: ircm-api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - report-service
      - case-service
    networks:
      - ircm-network

  # ============================================
  # FRONTEND (React / Vite)
  # ============================================

  frontend:
    build:
      context: ./frontend/ircm-frontend
      dockerfile: Dockerfile
    container_name: ircm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Tujuan proxy /api dan /storage (lihat vite.config.js). Di dalam jaringan
      # compose, gateway dipanggil lewat nama service — bukan localhost, yang di
      # dalam container menunjuk ke container itu sendiri.
      VITE_PROXY_TARGET: http://api-gateway
    volumes:
      - ./frontend/ircm-frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - ircm-network

networks:
  ircm-network:
    driver: bridge

volumes:
  mongodb-data:
  rabbitmq-data:
