services:
  # ============================================
  # DATABASE (1 MongoDB)
  # ============================================

  mongodb:
    image: mongo:latest
    container_name: ircm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - ircm-network

  # ============================================
  # MESSAGE BROKER (RabbitMQ)
  # ============================================

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ircm-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ircm-network

  # ============================================
  # BACKEND CONTAINERS (2 Express Services)
  # ============================================

  report-service:
    build:
      context: ./backend/reporting-service
      dockerfile: Dockerfile
    container_name: ircm-report-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/report_db
      JWT_SECRET: ircm_secret_key
      RABBITMQ_URL: amqp://rabbitmq:5672
      PORT: 8000
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      EMAIL_REMINDER_AFTER_MINUTES: ${EMAIL_REMINDER_AFTER_MINUTES:-30}
      EMAIL_REMINDER_LEASE_MINUTES: ${EMAIL_REMINDER_LEASE_MINUTES:-15}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      XAI_TIMEOUT_MS: ${XAI_TIMEOUT_MS:-20000}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    extra_hosts:
      # Diperlukan di Linux/WSL supaya host.docker.internal bisa diresolusi
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/reporting-service:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - ircm-network

  case-service:
    build:
      context: ./backend/case-service
      dockerfile: Dockerfile
    container_name: ircm-case-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/case_db
      JWT_SECRET: ircm_secret_key
      JWT_TTL: 3600
      RABBITMQ_URL: amqp://rabbitmq:5672
      PORT: 8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      REPORTING_SERVICE_URL: http://report-service:8000
      PETUGAS_DASHBOARD_URL: ${PETUGAS_DASHBOARD_URL:-http://localhost}
      EMAIL_REMINDER_POLL_MINUTES: ${EMAIL_REMINDER_POLL_MINUTES:-5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./backend/case-service:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - ircm-network

  # ============================================
  # API GATEWAY (NGINX)
  # ============================================

  api-gateway:
    image: nginx:1.31.3-alpine
    container_name: ircm-api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - report-service
      - case-service
    networks:
      - ircm-network

  # ============================================
  # FRONTEND (React / Vite)
  # ============================================

  frontend:
    build:
      context: ./frontend/ircm-frontend
      dockerfile: Dockerfile
    container_name: ircm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      API_GATEWAY_TARGET: http://api-gateway
    volumes:
      - ./frontend/ircm-frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - ircm-network

networks:
  ircm-network:
    driver: bridge

volumes:
  mongodb-data:
  rabbitmq-data:
