services:
  # ============================================
  # DATABASE (1 MongoDB)
  # ============================================

  mongodb:
    image: mongo:latest
    container_name: ircm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - ircm-network

  # ============================================
  # BACKEND CONTAINERS (3 Express Services)
  # ============================================

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: ircm-auth-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/auth_db
      JWT_SECRET: ircm_secret_key
      JWT_TTL: 3600
    volumes:
      - ./backend/auth-service:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
    networks:
      - ircm-network

  report-service:
    build:
      context: ./backend/reporting-service
      dockerfile: Dockerfile
    container_name: ircm-report-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/report_db
      JWT_SECRET: ircm_secret_key
      PORT: 8000
    volumes:
      - ./backend/reporting-service:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - auth-service
    networks:
      - ircm-network

  case-service:
    build:
      context: ./backend/case-service
      dockerfile: Dockerfile
    container_name: ircm-case-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/case_db
      JWT_SECRET: ircm_secret_key
      PORT: 8000
      REPORT_SERVICE_URL: http://report-service:8000
    volumes:
      - ./backend/case-service:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - auth-service
    networks:
      - ircm-network

  # ============================================
  # API GATEWAY (NGINX)
  # ============================================

  api-gateway:
    image: nginx:alpine
    container_name: ircm-api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - report-service
      - case-service
    networks:
      - ircm-network

  # ============================================
  # FRONTEND (React / Vite)
  # ============================================

  frontend:
    build:
      context: ./frontend/ircm-frontend
      dockerfile: Dockerfile
    container_name: ircm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/ircm-frontend:/app
      - /app/node_modules
    depends_on:
      - auth-service
      - report-service
      - case-service
    networks:
      - ircm-network

networks:
  ircm-network:
    driver: bridge

volumes:
  mongodb-data:
