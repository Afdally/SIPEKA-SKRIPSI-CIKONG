<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Integrasi SIPEKA GIS</title>
    
    <!-- Memuat CSS Leaflet untuk styling peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #header { padding: 15px 20px; background: #0f172a; color: white; display: flex; justify-content: space-between; align-items: center; }
        #header h2 { margin: 0; font-size: 1.2rem; }
        #status { font-size: 0.9rem; padding: 5px 10px; background: #3b82f6; border-radius: 5px; }
        #map { width: 100vw; height: calc(100vh - 60px); }
        .popup-content { font-size: 0.9rem; }
        .popup-content h4 { margin: 0 0 5px 0; color: #dc2626; }
        .popup-content p { margin: 2px 0; }
    </style>
</head>
<body>

    <div id="header">
        <h2>Peta Kerawanan SIPEKA (Test GIS)</h2>
        <span id="status">Mengambil data dari API...</span>
    </div>

    <!-- Kontainer Peta -->
    <div id="map"></div>

    <!-- Memuat Javascript Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inisialisasi Peta
        // Mengatur titik tengah default peta ke Kota Kendari (Lat: -3.998460, Lng: 122.512974)
        var map = L.map('map').setView([-3.998460, 122.512974], 12);

        // Menambahkan layer peta jalanan dari OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 2. Mengambil Data dari API SIPEKA Anda
        // Ganti URL ini dengan link cloudflare tunnel jika Anda mengetesnya lewat internet
        const API_URL = 'http://localhost:8080/api/laporan/public-gis';

        fetch(API_URL)
            .then(response => {
                if (!response.ok) throw new Error("Gagal mengambil data dari server SIPEKA. Pastikan backend menyala.");
                return response.json();
            })
            .then(res => {
                const dataLaporan = res.data;
                let titikBerhasil = 0;

                // Fungsi pembantu untuk menggambar marker
                const tambahMarker = (item, lat, lng, isGeocoded = false) => {
                    let popupHTML = `
                        <div class="popup-content">
                            <h4>${item.jenis_kekerasan || 'Kasus'}</h4>
                            <p><strong>Kode:</strong> ${item.kode_laporan}</p>
                            <p><strong>Status:</strong> ${item.status ? item.status.replace('_', ' ') : '-'}</p>
                            <p><strong>Kelurahan:</strong> ${item.kelurahan_korban || '-'}</p>
                            <p><strong>Lokasi:</strong> ${item.lokasi_kejadian || '-'}</p>
                            ${isGeocoded ? '<p><small style="color:gray;">*Titik hasil perkiraan (Geocoding Kelurahan)</small></p>' : ''}
                        </div>
                    `;

                    L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup(popupHTML);

                    titikBerhasil++;
                    document.getElementById('status').innerText = `Berhasil memuat ${titikBerhasil} titik kasus (dari total ${dataLaporan.length} data)`;
                    document.getElementById('status').style.background = '#16a34a'; // Hijau
                };

                // Antrian untuk data yang lat/long nya kosong (butuh Geocoding)
                const butuhGeocode = [];

                // 3. Meletakkan titik (marker) ke atas peta
                dataLaporan.forEach(item => {
                    // Jika data sudah punya koordinat (GPS) dari database
                    if (item.latitude !== null && item.longitude !== null) {
                        tambahMarker(item, item.latitude, item.longitude);
                    } else if (item.kelurahan_korban) {
                        // Jika koordinat kosong, masukkan ke antrian Geocoding berdasarkan nama kelurahan
                        butuhGeocode.push(item);
                    }
                });

                // Proses Geocoding secara berurutan agar tidak terkena blokir (Rate Limit) dari OpenStreetMap
                const prosesGeocoding = async () => {
                    if(butuhGeocode.length > 0) {
                        document.getElementById('status').innerText = `Berhasil memuat ${titikBerhasil} titik. Memproses Geocoding ${butuhGeocode.length} lokasi...`;
                        document.getElementById('status').style.background = '#d97706'; // Kuning/Orange
                    }

                    for (let item of butuhGeocode) {
                        try {
                            // Mencari koordinat berdasarkan nama kelurahan dan Kota Kendari
                            const query = `Kelurahan ${item.kelurahan_korban}, Kota Kendari, Sulawesi Tenggara`;
                            const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                            const geoData = await geoRes.json();
                            
                            if (geoData && geoData.length > 0) {
                                tambahMarker(item, geoData[0].lat, geoData[0].lon, true);
                            }
                            
                            // Jeda 1 detik agar tidak diblokir server Nominatim
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        } catch(e) {
                            console.error("Geocoding gagal untuk", item.kelurahan_korban);
                        }
                    }

                    if(butuhGeocode.length > 0) {
                        document.getElementById('status').innerText = `Selesai memuat ${titikBerhasil} titik kasus (dari total ${dataLaporan.length} data)`;
                        document.getElementById('status').style.background = '#16a34a'; // Hijau
                    }
                };

                // Jalankan proses geocoding
                prosesGeocoding();
            })
            .catch(error => {
                console.error(error);
                document.getElementById('status').innerText = 'Backend Error / Mati';
                document.getElementById('status').style.background = '#dc2626'; // Merah
                alert("Gagal konek ke SIPEKA. Pastikan backend SIPEKA jalan di port 8080!");
            });

    </script>
</body>
</html>
